<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>WiFi - Villa Caetano</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #333;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      padding: 28px 22px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    .logo {
      max-height: 58px;
      margin-bottom: 18px;
      display: inline-block;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #222;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 22px;
    }

    .qr-code {
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    .qr-code img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .wifi-info {
      background: #f4f6f8;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      text-align: left;
    }

    .wifi-info p {
      margin: 6px 0;
      font-size: 0.95rem;
    }

    .wifi-info strong {
      color: #111;
      font-weight: 600;
    }

    .wifi-logo {
      max-width: 120px;
      margin: 0 auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Clickable Logo (goes to homepage) -->
    <a href="/">
      <img src="assets/img/vcblack.png" alt="Villa Caetano" class="logo">
    </a>

    <h1>WiFi Access</h1>
    <p class="subtitle">Scan the QR code to connect automatically</p>

    <!-- QR Code -->
    <div class="qr-code">
      <img src="assets/img/wifi-qr.png" alt="WiFi QR Code">
    </div>

    <!-- WiFi Details -->
    <div class="wifi-info">
      <p><strong>SSID:</strong> Villa Caetano Guest</p>
      <p><strong>Password:</strong> Staymaster</p>
    </div>

    <!-- WiFi Logo -->
    <img src="assets/img/wifi-logo.svg" alt="WiFi" class="wifi-logo">
  </div>

</body>
</html>
