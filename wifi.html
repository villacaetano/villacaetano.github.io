<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi - Villa Caetano</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #333;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      padding: 40px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    .logo {
      max-height: 60px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #222;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 30px;
    }

    .qr-code {
      width: 220px;
      height: 220px;
      margin: 0 auto 25px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    .qr-code img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .wifi-info {
      background: #f4f6f8;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 25px;
      text-align: left;
    }

    .wifi-info p {
      margin: 8px 0;
      font-size: 1rem;
    }

    .wifi-info strong {
      color: #111;
      font-weight: 600;
    }

    .wifi-logo {
      max-width: 80px;
      margin: 0 auto;
      opacity: 0.7;
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #2dc997;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Villa Caetano Logo -->
  <img src="assets/img/vcblack.png" alt="Villa Caetano" class="logo" style="max-height: 70px; margin-bottom: 25px;">

  <h1>WiFi Access</h1>
  <p class="subtitle">Scan the QR code to connect automatically</p>

  <!-- QR Code Image -->
  <div class="qr-code">
    <img src="assets/img/wifi-qr.png" alt="WiFi QR Code">
  </div>

  <!-- WiFi Details -->
  <div class="wifi-info">
    <p><strong>SSID:</strong> Villa Caetano Guest</p>
    <p><strong>Password:</strong> Staymaster</p>
  </div>

  <!-- WiFi Logo -->
  <img src="assets/img/wifi-logo.svg" alt="WiFi" style="max-width: 140px; margin-top: 15px;">

  <a href="/" class="back-link">← Back to Villa Caetano</a>
</div>
